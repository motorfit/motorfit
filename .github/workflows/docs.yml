name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml", "scripts/publish_docs.sh"]
  pull_request:
    paths: ["docs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml", "scripts/publish_docs.sh"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.18"
          python-version: "3.12"
      - name: Build the handbook
        run: >-
          uv run --frozen --only-group docs sphinx-build
          -W --keep-going -b html -d outputs/docs-doctrees docs outputs/docs
      - name: Save the rendered handbook
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motorfit-docs
          path: outputs/docs
          include-hidden-files: true
          retention-days: 14
